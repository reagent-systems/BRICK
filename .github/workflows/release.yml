name: Publish GitHub Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and attach assets to (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'
        type: string

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            builder_args: --mac
            artifact_glob: |
              release/*.dmg
              release/*.zip
          - os: windows-latest
            platform: win
            builder_args: --win
            artifact_glob: |
              release/*.exe
              release/*.zip
    runs-on: ${{ matrix.os }}
    env:
      # macOS code signing (no-op on Windows / when secrets are unset).
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      # Build-time OAuth values injected into Vite bundle (import.meta.env.VITE_*).
      VITE_TWITTER_CLIENT_ID: ${{ secrets.VITE_TWITTER_CLIENT_ID }}
      VITE_TWITTER_CLIENT_SECRET: ${{ secrets.VITE_TWITTER_CLIENT_SECRET }}
      VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
      VITE_AUTH_BRIDGE_URL: ${{ secrets.VITE_AUTH_BRIDGE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', github.event.inputs.tag) || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build desktop app
        # electron-builder reads platform targets from package.json "build" field.
        # --publish never prevents auto-upload; we hand assets to action-gh-release below.
        run: npm run build && npx electron-builder ${{ matrix.builder_args }} --publish never

      - name: Publish release with assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
          files: ${{ matrix.artifact_glob }}
          body: |
            # 🧱 BRICK ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

            *A brutalist, flow-preserving tool for building in public directly from your IDE.*

            ---

            ## ⬇️ Downloads

            Grab the right file for your platform from the **Assets** section below.

            | Platform                  | File                              |
            | ------------------------- | --------------------------------- |
            | 🪟 Windows — installer     | `BRICK Setup *.exe`               |
            | 🪟 Windows — portable      | `BRICK-*-win.zip`                 |
            | 🍎 macOS — Apple Silicon   | `BRICK-*-arm64.dmg`               |
            | 🍎 macOS — Intel           | `BRICK-*-x64.dmg`                 |

            ---

            ## 🪟 Windows: "Windows protected your PC" warning

            BRICK is **unsigned** (no code-signing certificate yet), so Windows Defender SmartScreen pops up a blue dialog the first time you run it:

            > **Windows protected your PC**
            > *Microsoft Defender SmartScreen prevented an unrecognized app from starting…*

            This is normal — every indie Electron app gets it without a $300/yr cert. **It is safe to bypass** for a build you got from this repo:

            1. Click **More info** in the dialog
            2. Click **Run anyway**
            3. Done — Windows remembers the choice for future runs

            If your browser blocks the download, click the **▾** next to "Discard" → **Keep**.

            ---

            ## 🍎 macOS: "unidentified developer" warning

            If macOS refuses to open BRICK because it's "from an unidentified developer":

            - **Easy:** Right-click the app in Finder → **Open** → confirm, **or**
            - **Terminal:** `xattr -d com.apple.quarantine /Applications/BRICK.app`

            ---

            **Full changelog:** see commits on [GitHub](https://github.com/reagent-systems/BRICK/commits/${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}).
